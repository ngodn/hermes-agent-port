[package]
name = "hermes-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hermes-gateway"
path = "src/main.rs"

[dependencies]
hermes-core = { path = "../hermes-core" }
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait = "0.1"
unicode-general-category = "1"
# Match the Python 3.12 reference Unicode 15.0 normalization tables.
unicode-normalization = "=0.1.22"
reqwest = { workspace = true, features = ["multipart"] }
serde_yaml_ng = "0.10"
tokio-tungstenite = { version = "0.30", features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
tokio-util = "0.7"
rusqlite.workspace = true
sha2 = { workspace = true }
chrono = { workspace = true }
fancy-regex = "0.14"
aes-gcm = "0.11.1"
base64 = "0.22.1"
tiff = "0.11.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "pnm", "tga", "qoi", "hdr", "exr", "ff"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
